# After GitHub Pages has deployed main, tell IndexNow which pages changed in the last commit (Bing family; Google uses the sitemap).
# A failed ping never blocks anything: this runs after the deploy. By hand: node scripts/indexnow.mjs --all
name: indexnow
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  ping:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - run: node scripts/indexnow.mjs --since HEAD~1
        continue-on-error: true
